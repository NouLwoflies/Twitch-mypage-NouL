<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>推し事の書</title>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* --- 基本スタイル --- */
        html, body {
            height: 100%; margin: 0; padding: 0; overflow: hidden;
            position: fixed; width: 100%; overscroll-behavior-y: contain;
        }
        :root {
            --accent-orange: #ff8c00;
            --twitch-purple: #9146ff;
            --crystal-blue: #00d4ff;
            --bg-glass: rgba(255, 255, 255, 0.9);
        }
        body {
            font-family: 'Mochiy Pop One', sans-serif;
            background-size: cover; background-position: center; background-attachment: fixed;
            overflow: hidden; touch-action: pan-y;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.4); z-index: -1;
        }

        /* --- インベントリ --- */
        .inventory-bar {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 380px; height: 40px;
            background: #ffffff; border: 2px solid #f0f0f0;
            border-radius: 27px; display: flex; align-items: center;
            justify-content: space-around; padding: 0 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 9999; box-sizing: border-box;
        }
        .inv-item { display: flex; align-items: center; gap: 4px; flex: 1; justify-content: center; }
        .inv-item:not(:last-child) { border-right: 1px solid #f0f0f0; }
        .inv-icon { width: 16px; height: 16px; object-fit: contain; }
        .inv-val { font-size: 0.8rem; font-weight: 900; color: #2c3e50; }

        /* --- メインコンテンツ --- */
        .viewport {
            width: 100vw; height: 100vh; overflow: hidden; position: relative;
            padding-top: 70px; padding-bottom: 100px; box-sizing: border-box;
        }
        .main-wrapper {
            display: flex; width: 600vw; height: 100%;
            transition: transform 0.45s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .page-section {
            width: 100vw; height: 100%; display: flex; justify-content: center;
            align-items: flex-start; flex-shrink: 0; box-sizing: border-box; padding: 10px 15px;
        }
        .card {
            background: var(--bg-glass); border-radius: 25px; border: 3px solid #ffb347;
            padding: 15px; width: 100%; max-width: 350px; height: 85%;
            display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            position: relative; overflow: hidden;
        }
        @media screen and (max-height: 700px) { .card { height: 90%; } }

        .card h1 { 
            font-size: 1.3rem; margin: 0 0 15px; text-align: center; color: var(--accent-orange);
            border-bottom: 3px solid #ffb347; padding-bottom: 5px; flex-shrink: 0;
        }
        .card-body { flex-grow: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-right: 5px; }

        /* --- ステータス --- */
        .status-item { font-size: 0.95rem; margin-bottom: 12px; border-bottom: 1px solid #f5f5f5; padding-bottom: 5px; }
        .status-item span:first-child { font-size: 0.6rem; color: #888; display: block; }
        #display-rank { font-weight: bold; color: #daa520; }
        
        /* --- 経験値バー --- */
        .exp-container { margin: 15px 0; }
        .level-header { display: flex; justify-content: space-between; align-items: flex-end; }
        #display-level { font-size: 2rem; color: var(--accent-orange); font-weight: 900; }
        .exp-outline { background: #fdf2e2; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 5px; }
        .exp-fill { background: linear-gradient(to right, #ffb347, #ff4500); height: 100%; width: 0%; transition: width 1s ease; }

        /* --- ボタン・汎用 --- */
        button { border: none; font-family: inherit; transition: 0.1s; cursor: pointer; }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-btn { background: var(--twitch-purple); color: white; border-radius: 12px; padding: 12px; width: 100%; font-weight: bold; }
        .list-item { background: white; border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 2px solid #f0f0f0; }
        
        /* --- ガチャ --- */
        .gacha-box { background: #fff; border: 2px solid #f0f0f0; border-radius: 15px; padding: 12px; margin-bottom: 12px; }
        .draw-button { width: 100%; border-radius: 12px; padding: 10px; color: white; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .btn-bronze { background: linear-gradient(135deg, #d2691e, #8b4513); box-shadow: 0 4px 0 #5d2e0d; }
        .btn-silver { background: linear-gradient(135deg, #bdc3c7, #7f8c8d); box-shadow: 0 4px 0 #4f5b5c; }
        
        /* --- ナビゲーション --- */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 60px;
            background: rgba(255, 255, 255, 0.95); border-radius: 30px;
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); z-index: 1000;
        }
        .nav-item { background: none; color: #ccc; font-size: 0.5rem; text-align: center; }
        .nav-item.active { color: var(--accent-orange); }
        .nav-icon-emu { font-size: 1.4rem; display: block; }

        /* --- ローディング --- */
        #global-loading {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(255,255,255,0.7); z-index: 10001; justify-content: center; align-items: center; flex-direction: column;
        }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid var(--accent-orange); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- 景品オーバーレイ --- */
        .prizes-overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); z-index: 10002; justify-content: center; align-items: center;
        }
        .prizes-content { background: white; width: 90%; max-width: 380px; max-height: 80vh; border-radius: 20px; padding: 20px; overflow-y: auto; }
        
        /* --- 引っ張り更新 --- */
        #pull-to-refresh {
            position: fixed; top: -70px; left: 0; width: 100%; height: 60px;
            display: flex; justify-content: center; align-items: center;
            background: rgba(224, 234, 252, 0.9); z-index: 10000; transition: transform 0.1s;
            font-size: 0.8rem; font-weight: bold;
        }
    </style>
</head>
<body>

<!-- 全局共通ローディング -->
<div id="global-loading">
    <div class="loader"></div>
    <p id="loading-text" style="color:var(--accent-orange); font-weight:bold; margin-top:10px;">処理中...</p>
</div>

<div id="pull-to-refresh">↓ 引っぱって更新</div>

<div class="inventory-bar">
    <div class="inv-item">💎<span id="inv-bits" class="inv-val">0</span></div>
    <div class="inv-item"><img id="img-t1-icon" class="inv-icon"><span id="inv-t1" class="inv-val">0</span></div>
    <div class="inv-item"><img id="img-t2-icon" class="inv-icon"><span id="inv-t2" class="inv-val">0</span></div>
    <div class="inv-item"><img id="img-t3-icon" class="inv-icon"><span id="inv-t3" class="inv-val">0</span></div>
</div>

<div class="viewport">
    <div class="main-wrapper" id="master-container">
        <!-- Section 0: Status -->
        <section class="page-section">
            <div class="card">
                <h1><img id="st_icon_t1" height="24"> ステータス <img id="st_icon_t2" height="24"></h1>
                <div class="card-body">
                    <div id="login-area">
                        <p style="text-align: center;">Twitchでログインして<br>ステータスを確認しよう</p>
                        <button class="login-btn" onclick="login()">Twitch ログイン 💜</button>
                    </div>
                    <div id="status-area" style="display:none;">
                        <div id="vip-container"></div>
                        <div class="status-item"><span>PLAYER</span> <span id="display-name" style="font-size:1.1rem;">---</span></div>
                        <div class="status-item"><span>RANK</span> <span id="display-rank">---</span></div>
                        <div class="exp-container">
                            <div class="level-header">
                                <div><span style="font-size:0.7rem;">LEVEL</span> <span id="display-level">0</span></div>
                                <div style="font-size:0.75rem; color:#888;"><span id="display-current-exp">0</span> / <span id="display-next">0</span></div>
                            </div>
                            <div class="exp-outline"><div id="exp-bar" class="exp-fill"></div></div>
                        </div>
                        <button onclick="playGacha('4')" class="login-btn" style="background: var(--accent-orange);">🎁 1日1回ログインガチャ</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Section 1: Gacha -->
        <section class="page-section">
            <div class="card">
                <h1>🎰 ガチャ 🎰</h1>
                <button onclick="openPrizes()" class="list-item" style="width:100%; background:#fffaf0; border-color:#ffb347; font-weight:bold;">🎁 景品一覧を見る</button>
                <div class="card-body">
                    <div class="gacha-box" style="border-color: #cd7f32;">
                        <div style="font-size:0.9rem; margin-bottom:8px; color:#8b4513;">100円差し入れガチャ</div>
                        <button class="draw-button btn-bronze" onclick="playGacha('bits', 100)">💎 200 で引く</button>
                    </div>
                    <div class="gacha-box" style="border-color: #696969;">
                        <div style="font-size:0.9rem; margin-bottom:8px; color:#555;">500円差し入れガチャ</div>
                        <button class="draw-button btn-silver" onclick="playGacha('bits', 500)">💎 1000 で引く</button>
                    </div>
                    
                    <div id="tier-gacha-container">
                        <!-- JSで生成、またはそのまま記述 -->
                        <div style="color:var(--twitch-purple); font-size:0.8rem; font-weight:bold; margin:10px 0 5px;">TIER ガチャ</div>
                        <div style="display:flex; gap:8px; margin-bottom:10px;">
                            <button id="btn-t1-bg" class="draw-button" style="flex:1; height:60px; background-color:#333;" onclick="checkAndPlayTier(1, 1)">T1 最前列</button>
                            <button id="btn-t1-bg-2" class="draw-button" style="flex:1; height:60px; background-color:#333;" onclick="checkAndPlayTier(1, 11)">T1 見守り</button>
                        </div>
                        <!-- 他のTierも同様に配置可能 -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Section 2: Shop -->
        <section class="page-section">
            <div class="card">
                <h1>🛒 ショップ 🛒</h1>
                <div class="card-body">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <button class="list-item" style="border-color:#ffd700;" onclick="buyShop('VIP 1ヶ月', 200)">👑 VIP 1ヶ月<br>💎 200</button>
                        <button class="list-item" style="border-color:#ff4500;" onclick="buyShop('VIP 1年間', 2000)">🚀 VIP 1年<br>💎 2000</button>
                    </div>
                    <div class="list-item" style="border-color:var(--accent-orange); margin-top:15px;">
                        <div style="text-align:center; font-weight:bold; color:var(--accent-orange); margin-bottom:10px;">🎁 指定差し入れ</div>
                        <input type="text" id="gift-note" placeholder="例：スタバ券、入浴剤" style="width:100%; padding:8px; box-sizing:border-box; margin-bottom:10px; border:1px solid #ddd; border-radius:5px;">
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                            <button class="draw-button" style="background:#7f7fff; font-size:0.7rem;" onclick="buyShop('1000円', 2000, true)">1000円相当<br>💎2000</button>
                            <button class="draw-button" style="background:#ff7f7f; font-size:0.7rem;" onclick="buyShop('10000円', 20000, true)">10000円相当<br>💎20000</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Section 3: Pass -->
        <section class="page-section"><div class="card"><h1>🏆 パス 🏆</h1><div class="card-body" id="reward-list"></div></div></section>
        <!-- Section 4: Guide -->
        <section class="page-section"><div class="card"><h1>📖 ガイド 📖</h1><div class="card-body" id="guide-content"></div></div></section>
        <!-- Section 5: Log -->
        <section class="page-section"><div class="card"><h1>📜 履歴 📜</h1><div class="card-body" id="log-content">履歴はありません</div></div></section>
    </div>
</div>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="go(0)"><span class="nav-icon-emu">👤</span>ステータス</button>
    <button class="nav-item" onclick="go(1)"><span class="nav-icon-emu">🎰</span>ガチャ</button>
    <button class="nav-item" onclick="go(2)"><span class="nav-icon-emu">🛒</span>ショップ</button>
    <button class="nav-item" onclick="go(3)"><span class="nav-icon-emu">🏆</span>パス</button>
    <button class="nav-item" onclick="go(4)"><span class="nav-icon-emu">📖</span>ガイド</button>
    <button class="nav-item" onclick="go(5)"><span class="nav-icon-emu">📜</span>履歴</button>
</nav>

<!-- 景品オーバーレイ -->
<div id="prizesOverlay" class="prizes-overlay">
    <div class="prizes-content">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:10px;">
            <h3 style="margin:0;">景品ラインナップ</h3>
            <button onclick="closePrizes()" style="background:#eee; border-radius:50%; width:30px; height:30px;">×</button>
        </div>
        <div id="prizesData" style="margin-top:15px;"></div>
    </div>
</div>

<script>
    const CLIENT_ID = 'ph9btmot6supkrkqodmv1ct9h62rse';
    const SHEET_ID = '14CnmqmOSGrLVvZcS-aeAA1pruGocgidtwC2ax7ArJhI';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbypGUuQuNAh-ud_bkXYSCy0Ty6c7ypkQlqSCR-77hz0cnYPWS3w-thoGVTWCCsOWj_8/exec';
    const REDIRECT_URI = window.location.origin + window.location.pathname;

    const IMAGES = {
        BG_MAIN: '525_20241011150841.png',
        ST_ICON_1: 'mypage1.png',
        ST_ICON_2: 'mypage2.png',
        ICON_T1: 'tier1_.png', ICON_T2: 'tier_2_.png', ICON_T3: 'tier_3_.png',
        GACHA_T1_BG: '582_20260307010950.png'
    };

    let loginID = "";
    let inventory = { t1: 0, t2: 0, t3: 0 };

    // --- ユーティリティ ---
    function showLoading(text = "処理中...") {
        document.getElementById('loading-text').innerText = text;
        document.getElementById('global-loading').style.display = 'flex';
    }
    function hideLoading() {
        document.getElementById('global-loading').style.display = 'none';
    }

    function go(idx) {
        document.getElementById('master-container').style.transform = `translateX(-${idx * 100}vw)`;
        document.querySelectorAll('.nav-item').forEach((n, i) => i === idx ? n.classList.add('active') : n.classList.remove('active'));
    }

    // --- 初期化 ---
    window.onload = function() {
        document.getElementById('img-t1-icon').src = IMAGES.ICON_T1;
        document.getElementById('img-t2-icon').src = IMAGES.ICON_T2;
        document.getElementById('img-t3-icon').src = IMAGES.ICON_T3;
        document.body.style.backgroundImage = `url('${IMAGES.BG_MAIN}')`;

        const params = new URLSearchParams(window.location.hash.substring(1));
        const token = params.get('access_token');
        if (token) {
            getUserInfo(token);
        }
    };

    async function getUserInfo(token) {
        showLoading("ログイン中...");
        try {
            const res = await fetch('https://api.twitch.tv/helix/users', {
                headers: { 'Client-ID': CLIENT_ID, 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.data && data.data[0]) {
                loginID = data.data[0].login;
                document.getElementById('login-area').style.display = 'none';
                document.getElementById('status-area').style.display = 'block';
                await fetchSheetData(loginID);
                fetchLogs();
            }
        } catch (e) { alert("ログイン失敗"); }
        finally { hideLoading(); }
    }

    function login() {
        const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=user:read:email`;
        window.location.assign(authUrl);
    }

    // --- データ取得 ---
    async function fetchSheetData(targetUser) {
        try {
            const userUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Users`;
            const res = await fetch(userUrl);
            const csv = await res.text();
            const rows = csv.split('\n').map(r => r.split(',').map(c => c.replace(/"/g, '')));
            const userData = rows.find(r => r[1] && r[1].toLowerCase().trim() === targetUser.toLowerCase());

            if (userData) {
                document.getElementById('display-name').innerText = userData[0];
                document.getElementById('display-rank').innerText = userData[8] || "新顔さん";
                document.getElementById('inv-bits').innerText = userData[5];
                document.getElementById('inv-t1').innerText = userData[2];
                document.getElementById('inv-t2').innerText = userData[3];
                document.getElementById('inv-t3').innerText = userData[4];

                inventory.t1 = parseInt(userData[2]) || 0;
                inventory.t2 = parseInt(userData[3]) || 0;
                inventory.t3 = parseInt(userData[4]) || 0;

                const progress = getLevelProgress(parseInt(userData[6]) || 0);
                document.getElementById('display-level').innerText = progress.level;
                document.getElementById('display-current-exp').innerText = progress.current;
                document.getElementById('display-next').innerText = progress.next;
                document.getElementById('exp-bar').style.width = Math.min((progress.current / progress.next) * 100, 100) + '%';

                // VIP
                if (userData[9]) {
                    document.getElementById('vip-container').innerHTML = `
                        <div class="status-item" style="border-left:4px solid #e91e63; padding-left:10px;">
                            <span>VIP STATUS</span> <strong style="color:#e91e63;">👑 ${userData[9]}</strong>
                            <div style="font-size:0.6rem; color:#888;">${userData[10]}まで</div>
                        </div>`;
                }
                // バトルパス
                updateRewardList(userData, progress.level);
            }
        } catch (e) { console.error("Sheet Load Error", e); }
    }

    function getLevelProgress(totalExp) {
        const cfg = [{l:10,c:100},{l:20,c:500},{l:30,c:1000},{l:40,c:1500},{l:50,c:2000},{l:60,c:3000},{l:70,c:4000},{l:80,c:5000},{l:90,c:7000},{l:100,c:9000}];
        let currentTotal = totalExp;
        let lv = 1;
        for (let r of cfg) {
            let limit = r.l;
            while (lv < limit) {
                if (currentTotal >= r.c) { currentTotal -= r.c; lv++; }
                else return { level: lv, current: currentTotal, next: r.c };
            }
        }
        while (currentTotal >= 10000) { currentTotal -= 10000; lv++; }
        return { level: lv, current: currentTotal, next: 10000 };
    }

    // --- ガチャ・ショップ実行 ---
    async function playGacha(type, id) {
        if (!loginID) return;
        const gachaType = id || type;
        if (!confirm(`ガチャを引きますか？`)) return;

        showLoading("ガチャを回しています...");
        try {
            const res = await fetch(`${GAS_URL}?user=${encodeURIComponent(loginID)}&type=gacha&gachaType=${gachaType}`);
            const msg = await res.text();
            alert(msg);
            if (!msg.includes("不足") && !msg.includes("エラー")) {
                await fetchSheetData(loginID);
                fetchLogs();
            }
        } catch (e) { alert("通信エラー"); }
        finally { hideLoading(); }
    }

    function checkAndPlayTier(tierNum, gachaID) {
        if (inventory[`t${tierNum}`] >= 1) {
            playGacha('tier', gachaID);
        } else {
            alert("かけらが足りません！");
        }
    }

    async function buyShop(itemName, cost, isGift = false) {
        if (!loginID) return;
        let note = isGift ? document.getElementById('gift-note').value : "";
        if (isGift && !note) { alert("内容を入力してください"); return; }
        
        if (!confirm(`${itemName} を購入しますか？`)) return;

        showLoading("購入処理中...");
        try {
            const res = await fetch(`${GAS_URL}?user=${encodeURIComponent(loginID)}&type=shop&itemName=${encodeURIComponent(itemName)}&cost=${cost}&note=${encodeURIComponent(note)}`);
            const msg = await res.text();
            alert(msg);
            if (msg.includes("完了")) await fetchSheetData(loginID);
        } catch (e) { alert("通信エラー"); }
        finally { hideLoading(); }
    }

    // --- 景品表示 ---
    async function openPrizes() {
        document.getElementById('prizesOverlay').style.display = 'flex';
        const container = document.getElementById('prizesData');
        container.innerHTML = "読み込み中...";
        try {
            const res = await fetch(`${GAS_URL}?type=getGachaList`);
            const data = await res.json();
            let html = "";
            // ここでデータを整形してhtmlに追加
            data.forEach(item => {
                html += `<div style="padding:5px; border-bottom:1px solid #eee;">[${item.gacha}] ${item.result}</div>`;
            });
            container.innerHTML = html || "データがありません";
        } catch (e) { container.innerHTML = "取得失敗"; }
    }
    function closePrizes() { document.getElementById('prizesOverlay').style.display = 'none'; }

    // --- 履歴取得 ---
    async function fetchLogs() {
        try {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=GachaLog`);
            const txt = await res.text();
            const rows = txt.split('\n').map(r => r.split(',').map(c => c.replace(/"/g, '')));
            const myLogs = rows.filter(r => r[2] && r[2].toLowerCase() === loginID.toLowerCase()).reverse().slice(0, 10);
            
            let html = "";
            myLogs.forEach(l => {
                html += `<div style="font-size:0.8rem; padding:8px; border-bottom:1px solid #eee;">
                            <div style="color:#888; font-size:0.6rem;">${l[0]}</div>
                            <div><strong>${l[4]}</strong> ${l[6] ? '('+l[6]+')' : ''}</div>
                         </div>`;
            });
            document.getElementById('log-content').innerHTML = html || "履歴はありません";
        } catch (e) { }
    }

    // --- 引っ張り更新 ---
    let startY = 0;
    const ptr = document.getElementById('pull-to-refresh');
    window.addEventListener('touchstart', e => { if(window.scrollY===0) startY = e.touches[0].pageY; });
    window.addEventListener('touchmove', e => {
        const diff = e.touches[0].pageY - startY;
        if(diff > 0 && diff < 100) {
            ptr.style.transform = `translateY(${diff}px)`;
            if(diff > 60) ptr.innerText = "離して更新";
        }
    });
    window.addEventListener('touchend', () => {
        if(ptr.style.transform.includes('70') || parseInt(ptr.style.transform.replace(/\D/g,'')) > 60) {
            location.reload();
        }
        ptr.style.transform = 'translateY(0)';
    });

</script>
</body>
</html>
